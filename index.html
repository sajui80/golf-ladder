<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JAYPEE 골프 조추첨</title>
<style>
:root{--gold:#f5b700;--green:#0b7a3b;--ink:#10321f;--red:#e63946}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);
  background:linear-gradient(rgba(255,255,255,.40),rgba(255,255,255,.50)),url("photos/jaypee.jpg") center/cover fixed,#dff3e3;
  display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:10px 22px;min-height:104px;border-bottom:5px solid var(--gold);
  background:linear-gradient(90deg,rgba(255,255,255,.72),rgba(255,255,255,.10) 75%),url("photos/jaypee.jpg") center 62%/cover,linear-gradient(90deg,#bfeccd,#7fd8a0)}
.title{flex:1;min-width:0}
.title h1{margin:0;font-size:36px;letter-spacing:1px;color:#0b5d2a;text-shadow:0 0 6px #fff,0 0 12px #fff;white-space:nowrap}
.title p{display:inline-block;margin:4px 0 0;font-size:24px;font-weight:900;color:#fff;background:linear-gradient(90deg,#1259c3,#1f9bf0);padding:2px 16px;border-radius:20px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.modes{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.88);padding:8px 12px;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.modes span{font-size:22px;font-weight:900;color:#0b5d2a;margin-right:4px}
button{font-family:inherit;cursor:pointer;border:0;border-radius:10px;font-weight:900}
.mbtn{font-size:22px;padding:8px 16px;background:#e3efe6;color:#0b3d20}
.mbtn.on{background:var(--red);color:#fff;box-shadow:0 0 0 3px var(--gold)}
.tool{font-size:18px;padding:10px 14px;background:rgba(255,255,255,.9);color:#0b3d20;border:2px solid #0b7a3b}
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 370px;gap:12px;padding:10px 14px}
#stage{min-width:0;min-height:0;display:flex;flex-direction:column;background:rgba(255,255,255,.82);border:2px solid #fff;border-radius:16px;padding:8px 12px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
#roundbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.step{font-size:17px;font-weight:800;padding:4px 11px;border-radius:20px;background:#e3ece5;color:#5b7566}
.step.cur{background:var(--gold);color:#222;font-size:23px}
.step.fin{background:#1c9c56;color:#fff}
#hint{font-size:19px;font-weight:800;margin-left:auto;color:#0b5d2a}
.act{font-size:19px;padding:6px 14px;background:#3a86ff;color:#fff}
.act.alt{background:#8338ec}
.act.add{background:#12924d}
.act.nmb{background:#f77f00}
#players.shuf .pl{animation:pop .5s}
.tool.ico{font-size:22px;padding:8px 11px}
.tool.off{opacity:.45;filter:grayscale(1)}
.act:disabled{opacity:.45;cursor:default}
#nextBtn{font-size:23px;padding:7px 20px;background:var(--red);color:#fff;box-shadow:0 0 0 3px var(--gold);animation:pulse 1s infinite}
#fixedNote{font-size:18px;font-weight:900;color:#b3001b}
.row{display:grid}
.pl{background:none;color:var(--ink);padding:2px 0;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.pl .nm{font-weight:900;white-space:nowrap}
.pl.ready .av{box-shadow:0 0 0 4px var(--gold),0 0 16px 4px rgba(245,183,0,.75);animation:pulse 1.2s infinite}
.pl.done{cursor:default}
.pl.done .av{filter:grayscale(1) opacity(.55)}
.pl.done .nm{color:#9aa}
.av{position:relative;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;border:3px solid #fff;flex:none}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#wrap{flex:1;min-height:0;position:relative}
#wrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.hole{display:flex;flex-direction:column;align-items:center}
.hole svg{display:block}
.hole.hit svg .flag{animation:wave .25s 8 alternate;transform-origin:20px 30px}
#holes.shuf .hole{animation:pop .5s}
aside{min-height:0;overflow:hidden;display:flex;flex-direction:column;background:rgba(255,255,255,.90);border:3px solid var(--gold);border-radius:16px;padding:8px 10px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
aside h2{margin:0 0 2px;font-size:26px;text-align:center;color:#0b5d2a}
.legend{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-bottom:6px}
.legend i{font-style:normal;font-size:14px;font-weight:800;padding:2px 8px;border-radius:10px;color:#111}
#result{flex:1;min-height:0;display:flex;flex-direction:column;gap:5px}
.grp{flex:1;min-height:0;display:flex;align-items:stretch;gap:8px;background:#eef6f0;border-radius:12px;padding:5px}
.gno{width:66px;flex:none;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:#111}
.slots{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:4px}
.chip{font-size:clamp(19px,3.1vh,30px);font-weight:900;display:flex;align-items:center;justify-content:center;border-radius:8px;color:#111;min-height:0}
.chip.empty{background:#fff;border:2px dashed #b5c9ba;color:#b5c9ba;font-size:15px}
.chip.new{animation:flash .5s 5 alternate}
.s-exc{background:#d7a6ff}.s-top{background:#ffd23f;box-shadow:inset 0 0 0 3px #e08a00}.s-s2{background:#7cc4ff}.s-s3{background:#8ff0a4}.s-s4{background:#ffb37a}
#overlay{position:fixed;inset:0;background:rgba(0,40,20,.45);display:none;align-items:center;justify-content:center;z-index:50}
#overlay.show{display:flex}
.card{background:linear-gradient(160deg,#39c97c,#12924d);border:5px solid var(--gold);border-radius:24px;padding:14px 36px;text-align:center;color:#fff}
.card .big{font-size:50px;font-weight:900;margin:4px 0 6px}
.card .shot{font-size:34px;font-weight:900;color:#ffe066}
.arms{transform-origin:150px 92px;animation:swing 1.7s ease-in-out forwards}
.body{transform-origin:150px 140px;animation:turn 1.7s ease-in-out forwards}
.fly{animation:fly 1.7s ease-out forwards}
.whoosh{opacity:0;animation:whoosh 1.7s linear forwards}
#modal{position:fixed;inset:0;background:rgba(0,40,20,.45);display:none;align-items:center;justify-content:center;z-index:70}
#modal.show{display:flex}
.mcard{background:#fff;border:5px solid var(--gold);border-radius:22px;padding:22px 34px;width:min(720px,92vw);box-shadow:0 12px 40px rgba(0,0,0,.35)}
.mcard h3{margin:0 0 10px;font-size:36px;color:#0b5d2a}
.mcard ul{margin:0;padding-left:26px;font-size:24px;font-weight:700;line-height:1.55}
.mcard .warn{margin:12px 0 0;font-size:21px;font-weight:900;color:#c1121f}
.mbtns{display:flex;gap:12px;justify-content:flex-end;margin-top:18px}
.mbtns button{font-size:24px;padding:10px 24px}
#mOk{background:var(--red);color:#fff}
#mNo{background:#e3efe6;color:#0b3d20}
#toast{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(0);z-index:60;background:#ffd23f;color:#111;font-size:64px;font-weight:900;padding:18px 44px;border-radius:24px;border:6px solid #fff;box-shadow:0 10px 40px rgba(0,0,0,.45);transition:transform .25s;white-space:nowrap;pointer-events:none}
#toast.show{transform:translate(-50%,-50%) scale(1)}
.cf{position:fixed;top:-20px;width:12px;height:18px;z-index:55;pointer-events:none;animation:fall linear forwards}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes pop{50%{transform:scale(1.35) rotate(8deg)}}
@keyframes wave{to{transform:skewY(12deg)}}
@keyframes flash{to{background:#fff;transform:scale(1.08)}}
@keyframes swing{0%{transform:rotate(0)}30%{transform:rotate(155deg)}44%{transform:rotate(160deg)}58%{transform:rotate(0)}78%{transform:rotate(-128deg)}100%{transform:rotate(-138deg)}}
@keyframes turn{0%{transform:rotate(0)}30%,44%{transform:rotate(-5deg)}58%{transform:rotate(0)}78%,100%{transform:rotate(6deg)}}
@keyframes fly{0%,57%{transform:translate(0,0) scale(1)}100%{transform:translate(210px,-150px) scale(.45)}}
@keyframes whoosh{0%,50%{opacity:0}60%{opacity:.9}85%,100%{opacity:0}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ===== 디자인 시안 (주소 뒤에 ?theme=a / b / c) ===== */
@font-face{font-family:Oswald;src:url(fonts/oswald.woff2) format("woff2");font-display:swap}
@font-face{font-family:Montserrat;src:url(fonts/montserrat.woff2) format("woff2");font-display:swap}
@font-face{font-family:RobotoSlab;src:url(fonts/robotoslab.woff2) format("woff2");font-display:swap}
@font-face{font-family:NotoKR;src:url(fonts/notosanskr.woff2) format("woff2");font-display:swap}
@font-face{font-family:NotoSerifKR;src:url(fonts/notoserifkr.woff2) format("woff2");font-display:swap}
@font-face{font-family:BlackHan;src:url(fonts/blackhansans.woff2) format("woff2");font-display:swap}
@font-face{font-family:DoHyeon;src:url(fonts/dohyeon.woff2) format("woff2");font-display:swap}

/* --- A. TOUR CLASSIC : 네이비 · 레드 · 화이트 (기본 디자인) --- */
body.theme-a{--line:#0b2a5b;--gold:#d21f2b;--red:#d21f2b;--ink:#0b2a5b;font-family:NotoKR,"Malgun Gothic",sans-serif;background:linear-gradient(160deg,#f5f7fb,#e6ebf4)}
.theme-a header{min-height:100px;padding:10px 26px;gap:12px;border-bottom:0;box-shadow:inset 0 -3px 0 #d21f2b,inset 0 -4px 0 rgba(255,255,255,.55);
  background:linear-gradient(102deg,#071c40 0,#0f3272 54%,rgba(15,50,114,.42) 54.15% 100%),url("photos/jaypee.jpg") center 62%/cover}
.theme-a .title h1{font-family:Oswald,BlackHan,sans-serif;font-weight:400;font-size:38px;letter-spacing:3px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.3)}
.theme-a .title p{font-family:Oswald,BlackHan,sans-serif;font-weight:400;font-size:19px;letter-spacing:3px;color:#fff;background:linear-gradient(90deg,#1565d8,#38a8f5);border-radius:0;box-shadow:0 3px 10px rgba(21,101,216,.45);padding:2px 22px 2px 16px;margin-top:6px;clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%)}
.theme-a .modes{background:rgba(255,255,255,.10);box-shadow:inset 0 0 0 1px rgba(255,255,255,.28);border-radius:8px;padding:5px 6px 5px 14px;gap:4px;backdrop-filter:blur(4px)}
.theme-a .modes span{color:#fff;font-family:Oswald;font-weight:400;letter-spacing:3px;font-size:18px;margin-right:8px}
.theme-a button{border-radius:6px}
.theme-a .mbtn{background:none;color:#fff;font-family:Oswald;font-weight:400;font-size:22px;padding:5px 15px}
.theme-a .mbtn.on{background:#fff;color:#0b2a5b;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.theme-a .tool{background:rgba(255,255,255,.10);color:#fff;border:1px solid rgba(255,255,255,.45);font-size:16px;font-weight:400;backdrop-filter:blur(4px)}
.theme-a .tool.off{opacity:.6;filter:none;border-style:dashed}
.theme-a main{gap:14px;padding:14px 18px}
.theme-a #stage{background:#fff;border:0;border-radius:12px;padding:10px 14px;box-shadow:0 8px 28px rgba(11,42,91,.12);position:relative}
.theme-a #stage::before,.theme-a aside::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;border-radius:12px 12px 0 0;background:linear-gradient(90deg,#0b2a5b,#1f7ae0)}
.theme-a #roundbar{gap:6px;margin-bottom:6px}
.theme-a .step{border-radius:4px;background:none;color:#9aa6bd;font-size:15px;font-weight:400;padding:4px 10px;box-shadow:inset 0 -2px 0 #dfe5ef}
.theme-a .step.cur{background:#0b2a5b;color:#fff;font-size:19px;box-shadow:0 3px 10px rgba(11,42,91,.3)}
.theme-a .step.fin{background:none;color:#0b2a5b;box-shadow:inset 0 -2px 0 #1f7ae0}
.theme-a #hint{color:#0b2a5b;font-size:17px;font-weight:400}.theme-a #fixedNote{color:#d21f2b;font-size:16px}
.theme-a .act,.theme-a .act.alt,.theme-a .act.add,.theme-a .act.nmb{background:#fff;color:#0b2a5b;font-size:15px;font-weight:400;padding:5px 12px;box-shadow:inset 0 0 0 1.5px #0b2a5b}
.theme-a .act.nmb,.theme-a .act:first-of-type{}
.theme-a .act:hover{background:#0b2a5b;color:#fff}
.theme-a #nextBtn{background:#d21f2b;font-size:20px;font-weight:400;box-shadow:0 4px 14px rgba(210,31,43,.45)}
.theme-a .pl .nm{font-weight:400}
.theme-a .av{border:3px solid #fff;box-shadow:0 3px 10px rgba(11,42,91,.25)}
.theme-a .pl.ready .av{box-shadow:0 0 0 3px #d21f2b,0 4px 14px rgba(210,31,43,.4)}
.theme-a aside{background:#fff;border:0;border-radius:12px;padding:12px 12px 10px;box-shadow:0 8px 28px rgba(11,42,91,.12);position:relative}
.theme-a aside h2{font-family:Oswald,BlackHan,sans-serif;font-weight:400;letter-spacing:5px;color:#0b2a5b;font-size:24px;margin:2px 0 2px}
.theme-a .legend{margin-bottom:8px}
.theme-a .legend i{border-radius:3px;background:none !important;color:#5b6b88;font-weight:400;font-size:13px;padding:0 4px 0 8px;border-left:5px solid #999;box-shadow:none}
.theme-a .legend .s-top{border-left-color:#d21f2b}.theme-a .legend .s-exc{border-left-color:#9b5de5}.theme-a .legend .s-s2{border-left-color:#1f9bf0}.theme-a .legend .s-s3{border-left-color:#1fa35a}.theme-a .legend .s-s4{border-left-color:#f77f00}
.theme-a #result{gap:6px}
.theme-a .grp{background:#f4f6fa;border-radius:8px;padding:4px;gap:6px}
.theme-a .gno{width:62px;background:linear-gradient(160deg,#123a80,#081f45) !important;color:#fff;border-radius:6px;font-family:Oswald,BlackHan;font-weight:400;font-size:27px;box-shadow:inset 4px 0 0 #d21f2b}
.theme-a .chip{border-radius:5px;background:#fff;border-left:5px solid #999;box-shadow:0 1px 3px rgba(11,42,91,.12);font-size:clamp(16px,2.7vh,25px);font-weight:400}
.theme-a .chip.s-top{background:linear-gradient(160deg,#123a80,#081f45);color:#fff;border-left-color:#d21f2b}.theme-a .chip.s-exc{border-left-color:#9b5de5}.theme-a .chip.s-s2{border-left-color:#1f9bf0}.theme-a .chip.s-s3{border-left-color:#1fa35a}.theme-a .chip.s-s4{border-left-color:#f77f00}
.theme-a .chip.empty{background:none;border:1px dashed #c9d2e3;box-shadow:none;color:#c0c9db;font-size:13px}
.theme-a #overlay,.theme-a #modal{background:rgba(7,28,64,.55);backdrop-filter:blur(3px)}
.theme-a .card{background:linear-gradient(160deg,#123a80,#071c40);border:0;border-radius:14px;box-shadow:0 0 0 1px rgba(255,255,255,.25),0 20px 60px rgba(0,0,0,.45)}
.theme-a .card .shot{color:#5ab8ff;font-family:Oswald,BlackHan;font-weight:400;letter-spacing:4px}.theme-a .card .big{font-family:BlackHan;font-weight:400;letter-spacing:2px}
.theme-a #toast{background:#fff;color:#0b2a5b;border:0;border-radius:10px;font-family:Oswald,BlackHan;font-weight:400;letter-spacing:2px;font-size:58px;box-shadow:inset 0 -6px 0 #d21f2b,0 20px 60px rgba(7,28,64,.5)}
.theme-a .mcard{border:0;border-radius:14px;box-shadow:inset 0 5px 0 #0b2a5b,0 20px 60px rgba(7,28,64,.45)}
.theme-a .mcard h3{color:#0b2a5b;font-family:Oswald,BlackHan;font-weight:400;letter-spacing:2px}.theme-a .mcard ul{font-weight:400;font-size:22px}
.theme-a .mbtns button{font-weight:400;font-size:21px}.theme-a #mNo{background:#eef1f7;color:#0b2a5b}

/* --- B. TOURNAMENT RIBBON : 그린 리본 · 레드 포인트 --- */
body.theme-b{--line:#1e7a34;--gold:#1f8f3a;--red:#e5202e;--ink:#17402a;font-family:Montserrat,DoHyeon,"Malgun Gothic",sans-serif;background:linear-gradient(rgba(244,246,245,.88),rgba(244,246,245,.94)),url("photos/jaypee.jpg") center/cover fixed}
.theme-b header{background:linear-gradient(90deg,#f6f7f6 48%,rgba(246,247,246,.15)),url("photos/jaypee.jpg") center 62%/cover;border-bottom:6px solid #1f8f3a}
.theme-b .title{padding-left:30px}
.theme-b .title h1{display:inline-block;position:relative;font-size:32px;letter-spacing:1px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.22);background:linear-gradient(#3cba50,#1f8f3a);padding:5px 26px;border-radius:3px;box-shadow:0 3px 0 #14602a}
.theme-b .title h1::before,.theme-b .title h1::after{content:"";position:absolute;top:9px;width:30px;height:100%;background:#178a31}
.theme-b .title h1::before{left:-30px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,45% 50%)}
.theme-b .title h1::after{right:-30px;clip-path:polygon(0 0,100% 0,55% 50%,100% 100%,0 100%)}
.theme-b .title p{display:block;width:max-content;margin:0 0 0 46px;font-size:19px;letter-spacing:2px;background:#14602a;border-radius:0 0 8px 8px;box-shadow:none;padding:3px 22px}
.theme-b .modes{background:#fff}.theme-b .modes span{color:#14602a;letter-spacing:1px}
.theme-b button{border-radius:22px}
.theme-b .mbtn{background:#e6f3e8;color:#14602a}.theme-b .mbtn.on{background:#e5202e;box-shadow:none}
.theme-b .tool{border:2px solid #1f8f3a;color:#14602a;background:#fff}
.theme-b #stage{background:#fff;border:0;border-radius:18px}
.theme-b .step{background:#edf1ee;color:#7a8f80;font-size:16px}.theme-b .step.cur{background:#e5202e;color:#fff;font-size:21px}.theme-b .step.fin{background:#1f8f3a;color:#fff}
.theme-b .act{background:#1f8f3a;font-size:17px}.theme-b .act.alt{background:#14602a}.theme-b .act.add{background:#3cba50}.theme-b .act.nmb{background:#e5202e}
.theme-b #nextBtn{box-shadow:0 0 0 3px #1f8f3a}
.theme-b aside{background:#fff;border:0;border-radius:18px}
.theme-b aside h2{background:linear-gradient(#3cba50,#1f8f3a);color:#fff;border-radius:6px;margin:0 14px 6px;padding:3px 0;font-size:24px;letter-spacing:2px;box-shadow:0 3px 0 #14602a;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.theme-b .grp{background:#f1f5f2;border-radius:14px}.theme-b .gno{border-radius:12px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.theme-b .chip{border-radius:20px;font-size:clamp(18px,2.9vh,28px);font-weight:400}.theme-b .chip.empty{font-size:14px}
.theme-b .card{border:5px solid #fff;border-radius:22px}.theme-b #toast{background:#e5202e;color:#fff;border-radius:40px}
.theme-b .mcard{border:0;border-top:10px solid #1f8f3a}.theme-b .mcard h3{color:#14602a}
.theme-b .pl.ready .av{box-shadow:0 0 0 4px #e5202e,0 0 14px 3px rgba(229,32,46,.5)}

/* --- C. LEADERBOARD BLUE : 로열 블루 · 슬랩 세리프 --- */
body.theme-c{--line:#12357a;--gold:#fff;--red:#e63946;--ink:#12357a;font-family:RobotoSlab,NotoSerifKR,serif;background-color:#1a56c4;
  background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:28px 28px}
.theme-c header{background:linear-gradient(90deg,rgba(13,43,110,.94) 35%,rgba(13,43,110,.30)),url("photos/jaypee.jpg") center 62%/cover;border-bottom:3px solid #fff}
.theme-c .title h1{color:#fff;text-shadow:none;font-size:36px;letter-spacing:1px}
.theme-c .title p{background:#fff;color:#12357a;font-size:19px;border-radius:30px;box-shadow:none;padding:2px 20px;letter-spacing:1px}
.theme-c .modes{background:none;box-shadow:none}.theme-c .modes span{color:#fff;letter-spacing:2px}
.theme-c button{border-radius:30px}
.theme-c .mbtn{background:rgba(255,255,255,.18);color:#fff}.theme-c .mbtn.on{background:#fff;color:#12357a;box-shadow:none}
.theme-c .tool{background:none;color:#fff;border:2px solid #fff}
.theme-c #stage{background:#fff;border:0;border-radius:14px;box-shadow:0 8px 24px rgba(6,24,66,.45)}
.theme-c .step{background:#e8eefb;color:#6d83b5;font-size:16px}.theme-c .step.cur{background:#12357a;color:#fff;font-size:21px}.theme-c .step.fin{background:#7aa2e8;color:#fff}
.theme-c #hint{color:#12357a}.theme-c .act{background:#1a56c4;font-size:17px}.theme-c .act.alt{background:#12357a}.theme-c .act.add{background:#3f7fe6}.theme-c .act.nmb{background:#0d2b6e}

<body>
<header>
  <div class="title">

      <i class="s-top">탑(조장)</i><i class="s-exc">예외</i><i class="s-s2">2번</i><i class="s-s3">3번</i><i class="s-s4">4번</i>

  <div class="mbtns"><button id="mOk"></button><button id="mNo">닫기</button></div>
</div></div>
<script>
//CORE-START
const SEEDS={
  exc:{label:'예외 시드',names:['오희영','김진보']},
  top:{label:'탑 시드',names:['서보철','이선교','김고종','김휴목','최정갑','문종인','조규동']},
  s2:{label:'2번 시드',names:['고득기','김두환','최용석','김병균','김수완','김승용']},
  s3:{label:'3번 시드',names:['김지구','민유석','박형배','성경욱','윤재백','신정훈']},
  s4:{label:'4번 시드',names:['윤상근','정상준','변준현','하원일','임상우']}
};
const CAP={1:3,2:4,3:4,4:4,5:4,6:4,7:3};
const MIN_CROSS=15;
const RANK={top:0,exc:1,s2:2,s3:3,s4:4};
const SEED_OF={};
for(const k in SEEDS)SEEDS[k].names.forEach(n=>SEED_OF[n]=k);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildRounds(mode){
  const exc={key:'exc',title:'예외 시드',players:SEEDS.exc.names,dests:[1,1],fixed:[],straight:true};
  const top={key:'top',title:'탑 시드',players:SEEDS.top.names,dests:[1,2,3,4,5,6,7],fixed:[]};
  const s2={key:'s2',title:'2번 시드',players:SEEDS.s2.names,dests:[2,3,4,5,6,7],fixed:[]};
  const s3={key:'s3',title:'3번 시드',players:SEEDS.s3.names,dests:[2,3,4,5,6,7],fixed:[]};
  const s4={key:'s4',title:'4번 시드',players:SEEDS.s4.names,dests:[2,3,4,5,6],fixed:[]};
  if(mode===2){
    const fixed=[{name:'서보철',group:3},{name:'이선교',group:4}];
    return [exc,{key:'top',title:'탑 시드',players:SEEDS.top.names.filter(n=>!fixed.some(f=>f.name===n)),dests:[1,2,5,6,7],fixed},s2,s3,s4];
  }
  if(mode===3)return [exc,{key:'mix',title:'2·3·4번 시드 통합',players:[...SEEDS.s2.names,...SEEDS.s3.names,...SEEDS.s4.names],
      dests:[2,2,2,3,3,3,4,4,4,5,5,5,6,6,6,7,7],fixed:[]},top];
  return [exc,s2,s3,s4,top];
}
// rung {c,a,b}: 세로줄 c 의 높이 a 와 세로줄 c+1 의 높이 b 를 연결 (a≠b 이면 경사 → 공이 다시 올라갈 수 있음)
function tracePath(ladder,start){
  const ends={};
  ladder.rungs.forEach((r,i)=>{(ends[r.c]=ends[r.c]||[]).push({l:r.a,i,left:true});(ends[r.c+1]=ends[r.c+1]||[]).push({l:r.b,i,left:false});});
  for(const k in ends)ends[k].sort((x,y)=>x.l-y.l);
  let col=start,pos=-1,ups=0;const steps=[];
  for(let guard=0;guard<5000;guard++){
    const e=(ends[col]||[]).find(x=>x.l>pos);
    if(!e)break;
    const r=ladder.rungs[e.i],tc=e.left?r.c+1:r.c,tl=e.left?r.b:r.a;
    if(tl<e.l)ups++;
    steps.push({i:e.i,fc:col,fl:e.l,tc,tl});col=tc;pos=tl;
  }
  return {end:col,steps,ups};
}
function genLadder(n,straight){
  const levels=40;
  if(straight)return {levels,rungs:[]};
  for(;;){
    const rungs=[],used=[];for(let i=0;i<n;i++)used.push(new Set());
    for(let c=0;c<n-1;c++){let lastB=-1;
      for(let a=0;a<levels;a++){
        if(used[c].has(a)||Math.random()>0.5)continue;
        let d=0;if(Math.random()<0.6){d=1+Math.floor(Math.random()*4);if(Math.random()<0.5)d=-d;}
        const b=a+d;
        if(b<0||b>=levels||b<=lastB||used[c+1].has(b))continue;

function tryAddRung(lad,n){

      if(s!==ps){if(s%2===0)sfx.tick();ps=s;}
      const f=(d-cum[s-1])/((cum[s]-cum[s-1])||1),x=pts[s-1][0]+(pts[s][0]-pts[s-1][0])*f,y=pts[s-1][1]+(pts[s][1]-pts[s-1][1])*f;
      path.steps.forEach((st,k)=>{if(1+2*k<s&&!S.revealed.includes(st.i)){S.revealed.push(st.i);const e=$('r'+st.i);if(e)e.setAttribute('opacity','.9');}});
      trail.setAttribute('points',pts.slice(0,s).map(p=>p.join(',')).join(' ')+' '+x+','+y);
      ball.setAttribute('transform','translate('+x+','+y+') rotate('+(d/BALL_R*57.3)+')');
      if(d<total)requestAnimationFrame(frame);else res(path.end);
    }
    requestAnimationFrame(frame);
  });
}
function confetti(n){
  for(let i=0;i<n;i++){const e=document.createElement('div');e.className='cf';
    e.style.left=Math.random()*100+'vw';e.style.background=PC[i%PC.length];
    e.style.animationDuration=(1.5+Math.random()*1.5)+'s';e.style.animationDelay=Math.random()*.4+'s';
    document.body.appendChild(e);setTimeout(()=>e.remove(),3600);}
}
function toast(msg){return new Promise(res=>{const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>{t.classList.remove('show');res();},1900);});}
async function play(idx){
  const name=S.players[idx];
  if(busy||S.done.includes(name))return;
  busy=true;['peekBtn','shufBtn','addBtn','nameBtn'].forEach(id=>{if($(id))$(id).remove();});drawLadder();
  await swing(name,PC[idx%PC.length]);
  const end=await roll(idx),group=S.dests[end];
  S.done.push(name);S.results[group].push(name);lastNew=name;save();
  $('ball').style.display='none';
  const hole=$('hole'+end);if(hole)hole.classList.add('hit');
  confetti(50);renderResult();sfx.hole();
  await toast(name+' ▶ '+group+'조');
  busy=false;render();
  if(S.done.length===S.players.length&&S.round===rounds.length-1){confetti(160);sfx.fanfare();toast('🏆 조 편성 완료!');}
}
const MODE_INFO={
  1:{t:'MODE 1 · 기본 추첨',d:['진행 순서: 예외 → 2번 → 3번 → 4번 → 탑 시드','시드별로 사다리를 따로 진행 (조마다 시드별 1명)','예외 시드(오희영, 김진보)는 직선 사다리로 1조 확정','탑 시드(조장)는 마지막에 추첨']},
  2:{t:'MODE 2 · 탑 시드 2명 고정',d:['서보철 = 3조, 이선교 = 4조 고정','나머지 탑 시드 5명이 1·2·5·6·7조를 추첨','진행 순서: 예외 → 탑 → 2번 → 3번 → 4번 시드','시드별로 사다리를 따로 진행']},
  3:{t:'MODE 3 · 17명 통합 추첨',d:['진행 순서: 예외 → 2·3·4번 시드 17명 통합 → 탑 시드','17명은 시드 구분 없이 하나의 사다리로 추첨','예외 시드는 직선 사다리로 1조 확정','탑 시드(조장)는 마지막에 추첨']}
};
function showMode(m){
  const info=MODE_INFO[m],same=m===S.mode;
  $('mT').textContent=info.t+(same?' (현재 모드)':'');
  $('mB').innerHTML=info.d.map(x=>'<li>'+x+'</li>').join('');
  $('mW').textContent=(!same&&hasProgress())?'⚠ 시작하면 현재 추첨 결과가 삭제됩니다.':'';
  $('mOk').style.display=same?'none':'';$('mOk').textContent='MODE '+m+' 시작';
  $('mOk').onclick=()=>{$('modal').classList.remove('show');newGame(m);};
  $('modal').classList.add('show');
}
$('mNo').onclick=()=>$('modal').classList.remove('show');
document.querySelectorAll('.mbtn').forEach(b=>b.onclick=()=>{if(!busy)showMode(+b.dataset.m);});
$('sfxBtn').onclick=()=>{sfxOn=!sfxOn;$('sfxBtn').classList.toggle('off',!sfxOn);$('sfxBtn').textContent=sfxOn?'🔊':'🔇';if(sfxOn)sfx.tick();};
$('bgmBtn').onclick=()=>{bgmOn=!bgmOn;$('bgmBtn').classList.toggle('off',!bgmOn);if(bgmOn)bgmApply();else bgmStop();};
$('resetBtn').onclick=()=>{if(busy)return;if(confirm('추첨 결과를 모두 삭제하고 처음부터 다시 시작합니다. 진행하시겠습니까?'))newGame(S.mode);};
$('copyBtn').onclick=()=>{
  let t='[SIEL 2026년 하반기 골프 조 편성 결과]\n';for(let g=1;g<=7;g++)t+=g+'조: '+(ordered(S.results[g]).join(', ')||'-')+'\n';
  const done=()=>alert('결과를 복사했습니다.\n\n'+t);
  if(navigator.clipboard)navigator.clipboard.writeText(t).then(done,()=>prompt('아래 내용을 복사하십시오.',t));else prompt('아래 내용을 복사하십시오.',t);
};
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(!busy)render();},150);});
S=load();
if(S){rounds=buildRounds(S.mode);render();}else newGame(1);
